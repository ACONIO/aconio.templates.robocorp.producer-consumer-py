name: Reusable Integration Workflow

on:
  workflow_call:

permissions:
  contents: read

jobs:
    Lint:
      runs-on: ubuntu-latest
      steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v3
        with:
          python-version: 3.11
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pylint
      - name: Analysing the code with pylint
        run: |
          pylint --rcfile=pylintrc $(git ls-files 'bot/*.py')
    Spellcheck:
        runs-on: ubuntu-latest
        steps:
          - name: Checkout workflows repository 
            uses: actions/checkout@v4
            with:
              repository: 'ACONIO/aconio.common.workflows'
              token: ${{ secrets.ACONIO_PAT }}
              path: workflows
          
          - name: Checkout code repository 
            uses: actions/checkout@v4
            with:
              path: main
          
          - uses: rojopolis/spellcheck-github-actions@0.41.0
            name: spellcheck
            with: 
              config_path: workflows/spellcheck/.spellcheck.yaml